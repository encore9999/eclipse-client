name: Eclipse
options:
  deploymentTarget:
    iOS: "15.0"

packages:
  Tun2SocksKit:
    url: https://github.com/EbrahimTahernejad/Tun2SocksKit
    branch: main   # после первой успешной сборки зафиксируйте тег/ревизию

targets:
  Eclipse:
    type: application
    platform: iOS
    sources: [App, Shared]   # App/Assets.xcassets (иконка) подхватывается автоматически
    dependencies:
      - target: EclipseTunnel
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Eclipse
        NSCameraUsageDescription: Камера нужна для сканирования QR-кода подписки
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        # Bundle ID оставлен прежним: он привязан к вашему профилю подписи
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vpntest
        PRODUCT_NAME: Eclipse
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"

  EclipseTunnel:
    type: app-extension
    platform: iOS
    sources: [Tunnel, Shared]
    dependencies:
      # gomobile-фреймворк статический, поэтому не встраиваем
      - framework: Frameworks/Xray.xcframework
        embed: false
        link: true
      - package: Tun2SocksKit
      - sdk: libresolv.tbd   # нужен Go-рантайму
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Eclipse Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Tunnel/Tunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        # ДОЛЖЕН быть: bundle ID приложения + ".tunnel"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vpntest.tunnel
        PRODUCT_NAME: EclipseTunnel
        SWIFT_VERSION: "5.0"
