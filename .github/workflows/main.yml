name: Build unsigned ipa
on: push

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build Xray.xcframework
        run: |
          cd xray
          [ -f go.mod ] || go mod init example.com/xrayroot
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          go get github.com/xtls/xray-core@latest
          go get github.com/sagernet/sing-box@v1.14.2
          go get -tool golang.org/x/mobile/cmd/gobind
          go get -tool golang.org/x/mobile/cmd/gomobile
          go mod tidy
          mkdir -p ../Frameworks
          gomobile bind -target=ios -iosversion=15.0 -trimpath \
            -tags="with_quic" \
            -ldflags="-s -w -checklinkname=0" \
            -o ../Frameworks/Xray.xcframework ./xraybridge
          ls -la ../Frameworks

      - name: Prepare app icon
        run: |
          set -e
          ICON=$(find . -name 'icon-1024.png' -not -path './build/*' | head -n 1)
          if [ -z "$ICON" ]; then echo "icon-1024.png не найден в репозитории"; exit 1; fi
          echo "Иконка: $ICON"
          D=App/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$D"
          if [ "$(realpath "$ICON")" != "$(realpath "$D/icon-1024.png" 2>/dev/null || echo none)" ]; then
            cp "$ICON" "$D/icon-1024.png"
          fi
          cat > App/Assets.xcassets/Contents.json <<'EOF'
          { "info" : { "author" : "xcode", "version" : 1 } }
          EOF
          cat > "$D/Contents.json" <<'EOF'
          {
            "images" : [
              { "filename" : "icon-1024.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF
          find App/Assets.xcassets -type f

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Eclipse.xcodeproj -scheme Eclipse \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Eclipse.app Payload/
          zip -r Eclipse-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Eclipse-unsigned-ipa
          path: Eclipse-unsigned.ipa
